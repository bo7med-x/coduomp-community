// ============================================================
// coduomp-community - dedicated.cfg
// A community fork of coduomp with additional features.
// https://github.com/bo7med-x/coduomp-community
// Not affiliated with Activision.
// ============================================================

// --- Basic server settings ---
set sv_hostname "^2coduomp-community^7 server"
set sv_maxclients "16"
set g_gametype "dm"
set rconpassword "CHANGE_ME_PLEASE"

// --- Pure client check (disable to allow modded clients) ---
set sv_pure "0"
set sv_allowdownload "1"
set sv_allowanonymous "0"

// --- Fast download (community feature) ---
// Number of 2KB blocks sent per snapshot frame.
// 0 = disabled (stock behavior), 8 = slow, 16 = balanced, 32 = fast LAN.
set sv_fastDownload "16"

// --- Download visibility (community features) ---
// Notify players when they start downloading a file.
set sv_downloadNotifications "1"
// Append every download to downloads.log on the server.
set sv_downloadLog "1"

// --- Anti-flood protection (community feature) ---
// Limit simultaneous connections per IP address. 0 = disabled.
set sv_maxConnectionsPerIP "3"

// --- Welcome message (community feature) ---
// Full customization with placeholders:
//   %name    -> player name
//   %ip      -> player IP
//   %num     -> client slot number
//   %city    -> city from geolocation
//   %region  -> region from geolocation
//   %country -> country from geolocation
//   %loc     -> combined location (see sv_welcomeLocation)
// Color codes: ^1=red ^2=green ^3=yellow ^4=blue ^5=cyan ^6=magenta ^7=white
set sv_welcome "^2[Server]^7 Welcome ^3%name ^7from ^5%city^7, ^6%country^7! Enjoy your stay."
// What %loc expands to:
//   0 = disabled, 1 = country, 2 = city+country, 3 = region+city+country
set sv_welcomeLocation "2"

// --- Debug output (keep off in production) ---
set sv_debug "0"

// --- Network ---
set sv_maxRate "25000"
set sv_fps "30"
set sv_floodProtect "1"

// --- Rotation ---
set sv_mapRotation "map mp_carentan map mp_foy map mp_kharkov"

// --- Master server (optional extra) ---
set sv_master2 "master.cod.pm"
